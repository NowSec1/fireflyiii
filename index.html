<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firefly III 消费分析</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="title-group">
                <h1>Firefly III 消费分析仪表盘</h1>
                <p class="subtitle">输入个人访问令牌并选择月份，快速了解当月消费结构</p>
            </div>
        </header>
        <main class="main">
            <section class="card">
                <form id="query-form" class="form">
                    <div class="form-group">
                        <label for="token">个人访问令牌</label>
                        <input type="password" id="token" name="token" placeholder="请输入 Firefly III 个人访问令牌" required />
                    </div>
                    <div class="form-group">
                        <label for="month">查询月份</label>
                        <input type="month" id="month" name="month" required />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary">分析消费</button>
                        <button type="button" id="reset-btn" class="btn ghost">清空结果</button>
                    </div>
                    <p class="hint">不会保存您的令牌，数据仅用于本地分析。</p>
                </form>
            </section>

            <section class="results" id="results" hidden>
                <div class="grid">
                    <div class="card highlight">
                        <h2>消费概览</h2>
                        <div id="summary" class="summary"></div>
                    </div>
                    <div class="card chart-card">
                        <div class="chart-header">
                            <h2>消费分类占比</h2>
                            <span class="chart-description">展示各分类在总消费中的占比</span>
                        </div>
                        <canvas id="category-pie" aria-label="消费分类饼图" role="img"></canvas>
                    </div>
                    <div class="card chart-card">
                        <div class="chart-header">
                            <h2>分类消费金额</h2>
                            <span class="chart-description">按金额从高到低的分类柱状图</span>
                        </div>
                        <canvas id="category-bar" aria-label="消费分类柱状图" role="img"></canvas>
                    </div>
                </div>

                <section class="card table-card">
                    <div class="table-header">
                        <div>
                            <h2>分类详情</h2>
                            <p>展示各分类的消费笔数、金额及占比</p>
                        </div>
                        <div class="currency" id="currency"></div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>分类</th>
                                    <th>笔数</th>
                                    <th>金额</th>
                                    <th>占比</th>
                                </tr>
                            </thead>
                            <tbody id="category-table"></tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
        <footer class="footer">
            <p>数据来源：Firefly III API · 分析结果不包含转账与收入</p>
        </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
